# Blueprint de deploy contínuo no Render (https://render.com/docs/blueprint-spec)
# Uso: New > Blueprint > selecionar este repositório no GitHub.
#
# Caso prefira usar o Supabase como banco (em vez do PostgreSQL do Render),
# remova a seção "databases" abaixo e, no serviço web, troque o valor de
# DATABASE_URL para "sync: false" — o valor será preenchido manualmente
# no painel do Render com a connection string do Supabase.

services:
  - type: web
    name: devshowcase-api
    runtime: node
    plan: free
    region: oregon
    branch: master
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devshowcase-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: devshowcase-db
    plan: free
    region: oregon
